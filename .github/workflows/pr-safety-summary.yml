name: PR Safety Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  summarize:
    if: github.event.pull_request.user.login == 'khalifa-branding'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Summarize PR and post safety verdict
        env:
          GITHUB_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:              ${{ github.event.pull_request.number }}
          PR_URL:                 ${{ github.event.pull_request.html_url }}
          PR_TITLE:               ${{ github.event.pull_request.title }}
          PR_AUTHOR:              ${{ github.event.pull_request.user.login }}
          BASE_REF:               ${{ github.event.pull_request.base.ref }}
          REVIEWER_HANDLE:        tresconevents
          EVENTPILOT_WEBHOOK_URL: https://eventpilot.tresconglobal.com/api/webhooks/github-pr
          GITHUB_PR_WEBHOOK_SECRET: ${{ secrets.GITHUB_PR_WEBHOOK_SECRET }}
        run: node .github/scripts/pr-safety-summary.js
