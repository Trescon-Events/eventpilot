name: HubSpot CRM pull sync

# Fires the /api/cron/hubspot-crm-pull-sync endpoint every 15 minutes.
# Pulls HubSpot edits back into crm_contacts/crm_companies — but only for
# records EventPilot itself already pushed there (has a hubspot_contact_id/
# hubspot_company_id), never a blanket poll of the account's Contacts/
# Companies. See app/lib/hubspot/crm-pull-sync.ts for the full design.
#
# Same 15-minute cadence as revoke-expired-access.yml, for the same
# reasons: cheap (2 HubSpot batch/read calls per run, trivial against any
# tier's daily API cap) and there's no low-latency need — a human editing a
# HubSpot record directly is an occasional event, not something needing
# near-real-time propagation. This is the "backstop" half of a hybrid pull
# design; the low-latency webhook half isn't built (HubSpot Service Keys
# can't register webhook subscriptions via API, only manually per-property
# in HubSpot's own UI, which hasn't been done).
#
# Uses Railway direct URL — see revoke-expired-access.yml's own note on why
# (Cloudflare challenges GitHub Actions IPs as bots on the proxied domain).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:      # manual trigger for testing

jobs:
  pull-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Call HubSpot CRM pull-sync endpoint
        run: |
          curl --fail-with-body --silent --show-error \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://eventpilot-production-90c6.up.railway.app/api/cron/hubspot-crm-pull-sync"
