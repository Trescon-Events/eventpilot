name: Task Manager Follow-Up Reminders

# Fires /api/cron/task-manager-followups hourly on working days (Mon–Fri).
# Lives under /api/cron/* so middleware.ts passes it through to CRON_SECRET auth.
# The endpoint evaluates each recipient's local office timezone and dispatches
# Email + MS Teams digests 3 times daily (morning, midday, late afternoon) for
# overdue and 3+ days untouched tasks, with a 3-hour cooldown.
# Uses the Railway direct URL: the primary host is behind Cloudflare.

on:
  schedule:
    - cron: '0 * * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call Task Manager follow-up sweep endpoint
        run: |
          status=$(curl --silent --show-error --max-time 120 \
            -o /tmp/resp.txt -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://eventpilot-production-90c6.up.railway.app/api/cron/task-manager-followups")
          cat /tmp/resp.txt
          echo ""
          echo "HTTP $status"
          test "$status" -eq 200
